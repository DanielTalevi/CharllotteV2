<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Charlotte</title>

    <link rel="stylesheet"
          th:href="@{/css/login.css}">

</head>

<body>

<main class="login-box">

    <header class="logo-container">

        <div class="logo-icon">
            <span>⌁</span>
        </div>

        <div class="logo-text">

            <span class="logo-title">
                Charlotte
            </span>

            <span class="logo-subtitle">
                RECURSOS HUMANOS
            </span>

        </div>

    </header>


    <form th:action="@{/login}"
          method="post">

        <div class="input-group">

            <label for="email">
                Email
            </label>

            <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="seu@email.com"
                    required>

        </div>


        <div class="input-group">

            <label for="password">
                Senha
            </label>

            <input
                    type="password"
                    id="password"
                    name="senha"
                    placeholder="••••••••"
                    required>

        </div>


        <button
                type="submit"
                class="login-button">

            Entrar

        </button>

    </form>

</main>


<script th:src="@{/js/login.js}"></script>

<script th:src="@{/js/all.js}"></script>

</body>

</html>
