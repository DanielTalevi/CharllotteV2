<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <link rel="stylesheet" th:href="@{/css/all.css}">
    <title>Minhas Vendas</title>

</head>

<body>


<!-- =========================
     SIDEBAR
========================= -->

<aside class="sidebar">

    <div class="logo">
        Charllotte
    </div>

    <nav class="menu">

        <a th:href="@{/home}">
            Dashboard
        </a>

        <a th:href="@{/vendas}" class="active">
            Vendas
        </a>

        <a href="#">
            Livros
        </a>

        <a href="#">
            Empréstimos
        </a>

        <a href="#">
            Relatórios
        </a>

        <a href="#">
            Configurações
        </a>

        <a href="#">
            Sair
        </a>

    </nav>

</aside>


<!-- =========================
     MAIN
========================= -->

<main class="main">


    <!-- TOPBAR -->

    <header class="topbar">

        <h1>Minhas Vendas</h1>

        <div class="user">
            Daniel2
        </div>

    </header>


    <!-- CONTEÚDO -->

    <section class="content">

        <div class="content-header">

            <h2>Vendas realizadas</h2>

            <a th:href="@{/vendas/nova}"
               class="btn-cadastrar">

                + Cadastrar Venda

            </a>

        </div>


        <!-- TABELA -->

        <div class="table-container">

            <table>

                <thead>

                <tr>
                    <th>Data</th>
                    <th>Valor</th>
                    <th>Status</th>
                </tr>

                </thead>


                <tbody>

                <tr th:each="venda : ${vendas}">

                    <td th:text="${venda.dataVenda}">
                        Data
                    </td>

                    <td th:text="${venda.valorTotal}">
                        Valor
                    </td>

                    <td>

                        <span
                                th:if="${venda.status.name() == 'REALIZADA'}"
                                class="status status-realizada">

                            Realizada

                        </span>

                        <span
                                th:if="${venda.status.name() == 'CANCELADA'}"
                                class="status status-cancelada">

                            Cancelada

                        </span>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>


        <!-- SEM VENDAS -->

        <div
                th:if="${#lists.isEmpty(vendas)}"
                class="sem-vendas">

            Você ainda não possui vendas.

        </div>

    </section>


</main>

</body>

</html>
