<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>:root {
    --primary-color: #0e4837;
    --secundary-color: #ffffff;
    --terciary-color: #d6ad32;
}

* {
    padding: 0;
    margin: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background-color: var(--primary-color);
    display: flex;
    justify-content: center;
    align-items: center;
}

.login-box {
    display: flex;
    background-color: var(--secundary-color);
    width: 410px;
    min-height: auto;
    padding: 30px;
    flex-direction: column;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
    border-radius: 14px;
}

.logo-container {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 55px;
}

.logo-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 56px;
    height: 56px;
    margin-right: 13px;
    background-color: var(--terciary-color);
    border-radius: 8px;
    box-shadow: 0 3px 6px rgba(0, 0, 0, 0.12);
}

.logo-icon span {
    font-size: 26px;
    color: var(--primary-color);
    font-weight: bold;
}

.logo-text {
    display: flex;
    flex-direction: column;
}

.logo-title {
    font-size: 24px;
    font-weight: 300;
    color: #91e1d4;
    line-height: 1;
}

.logo-subtitle {
    margin-top: 6px;
    font-size: 11px;
    letter-spacing: 1.4px;
    color: #66757b;
}

.profile-section {
    width: 100%;
}

.section-title {
    text-align: center;
    font-size: 12px;
    color: #777;
    margin-bottom: 12px;
}

.profiles {
    display: flex;
    gap: 12px;
    width: 100%;
}

.profile-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    height: 87px;
    background-color: var(--secundary-color);
    border: 2px solid #eeeeee;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    color: #333;
    transition: border-color 0.2s ease, color 0.2s ease, background-color 0.2s ease;
}

.profile-icon {
    font-size: 23px;
    color: #68747a;
    margin-bottom: 10px;
    transition: color 0.2s ease;
}

.profile-card span {
    font-size: 14px;
}

.profile-card.selected {
    border-color: var(--terciary-color);
    background-color: var(--secundary-color);
    color: var(--terciary-color);
}

.profile-card.selected .profile-icon {
    color: var(--terciary-color);
}

.profile-card:hover {
    border-color: var(--terciary-color);
}

#loginForm {
    margin-top: 27px;
}

.input-group {
    display: flex;
    flex-direction: column;
    margin-bottom: 18px;
}

.input-group label {
    font-size: 13px;
    color: #424242;
    margin-bottom: 10px;
}

.input-group input {
    width: 100%;
    height: 46px;
    border: 1px solid var(--secundary-color);
    border-radius: 6px;
    padding: 0 13px;
    font-family: inherit;
    font-size: 14px;
    color: #555;
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

.input-group input::placeholder {
    color: #8b969b;
}

.input-group input:focus {
    border-color: var(--terciary-color);
    box-shadow: 0 0 0 2px rgba(214, 173, 50, 0.12);
}

.login-button {
    width: 100%;
    height: 45px;
    margin-top: 22px;
    border: none;
    border-radius: 7px;
    background-color: var(--terciary-color);
    color: #2d2d2d;
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
    transition: background-color 0.2s ease, transform 0.1s ease;
}

.login-button:hover {
    background-color: var(--terciary-color);
}

.login-button:active {
    transform: scale(0.99);
}</style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <main class="login-box">
        <header class="logo-container">
            <div class="logo-icon">
                <span>⌁</span>
            </div>
            <div class="logo-text">
                <span class="logo-title">Charlotte</span>
                <span class="logo-subtitle">RECURSOS HUMANOS</span>
            </div>
        </header>

        <section class="profile-selection">
            <p class="section-title">Selecione seu perfil</p>

            <div class="profiles">
                <button type="button" class="profile-card selected" data-profile="frentista">
                    <i class="fa-regular fa-user profile-icon"></i>
                    <span>Frentista</span>
                </button>
                <button type="button" class="profile-card" data-profile="admin">
                    <i class="fa-solid fa-briefcase profile-icon"></i>
                    <span>RH / Admin</span>
                </button>
            </div>
        </section>

        <form th:action="@{/login}" method="post">
            <div class="input-group">
                <label for="email">Email</label>
                <input
                type="email"
                id="email"
                name="email"
                placeholder="seu@email.com"
                required>
            </div>

            <div class="input-group">
                <label for="password">Senha</label>

                <input
                    type="password"
                    id="password"
                    name="senha"
                    placeholder="••••••••"
                    required>
            </div>

            <button
                    type="submit"
                    class="login-button">
                Entrar
            </button>
        </form>
    </main>

    <script>const profileCards = document.querySelectorAll(".profile-card");

let selectProfile = "frentista";

profileCards.forEach(card => {
    card.addEventListener("click", () => {

        profileCards.forEach(item => {
            item.classList.remove("selected");
        });

        card.classList.add("selected");

        selectProfile = card.dataset.profile;

        console.log("Perfil selecionado:", selectProfile);
    });
});
</script>
</body>
</html>
